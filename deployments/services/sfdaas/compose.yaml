services:
  sfdaas:
    image: sfdaas:latest
    container_name: sfdaas
    hostname: sfdaas
    ports:
      - "127.0.0.1:10000:8080"
    environment:
      DEPLOYMENT_ENVIRO: ${DEPLOYMENT_ENVIRO}
      HTTPS_PROXY: ${HTTPS_PROXY}
      HTTP_PROXY: ${HTTP_PROXY}
      NO_PROXY: ${NO_PROXY}
      MAVEN_HTTPS_PROXY: ${MAVEN_HTTPS_PROXY}
      MAVEN_HTTP_PROXY: ${MAVEN_HTTP_PROXY}
      MAVEN_SETTINGS_FILE: ${MAVEN_SETTINGS_FILE}
